<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IronFocus - Pre-Task View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --accent1: #6C63FF;
      --accent2: #48C9B0;
      --bg: linear-gradient(135deg, #fdfbfb, #ebedee);
      --text: #1e1e2f;
      --muted: #777;
      --border: #d1d9e6;
      --input-bg: #f3f7fb;
      --input-bg : #fff;
      --tamplate-btn-hover : linear-gradient(135deg, #e6e9ff, #f7f9fc);
      --tamplate-btn : linear-gradient(135deg, #f5f5f5, #f0f4ff);
      --card-bg : linear-gradient(145deg, #fdfdfd, #f4f7fa);
      --card-shadow :  0 10px 30px rgba(108, 99, 255, 0.15);
      --card-border : 2px solid #dfe6f2;
      --tamplate-btn-border : 2px solid #dce3f0;
      --range-input-shadow :  0 2px 6px rgba(0,0,0,0.15);
      --text-input-shadow : 0 0 0 4px rgba(108, 99, 255, 0.1);
    }

@media (prefers-color-scheme: dark) {
  :root {
    --accent1: #6C63FF; /* Keep – high visibility on dark */
    --accent2: #48C9B0;

    --bg: linear-gradient(135deg, #1a1a2e, #12131a); /* Soft dark background */
    --text: #f1f2f6;          /* Light text for contrast */
    --muted: #999;            /* Dimmed secondary text */
    --border: #2f354a;        /* Low-contrast borders */

    --input-bg: #1e1e2f;      /* Input fields */
    --tamplate-btn-hover: linear-gradient(135deg, #2a2e48, #1f212d); /* Hover contrast */
    --tamplate-btn: linear-gradient(135deg, #242637, #1e1f2e);       /* Default btn bg */

    --card-bg: linear-gradient(145deg, #1c1d2e, #232436); /* Elevated surface */
    --card-shadow: 0 10px 30px rgba(108, 99, 255, 0.07);  /* Softer shadow for dark mode */
    --card-border: 2px solid #2a2f3c;

    --tamplate-btn-border: 2px solid #2b2f3f; /* Button border match */
    --range-input-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);  /* Stronger to show depth */
    --text-input-shadow: 0 0 0 4px rgba(108, 99, 255, 0.2); /* Glowing accent */
  }
}

/*:root {
    --accent1: #0077ff;
    --accent2: #0088ee;
    --bg: #f0f2f5;
    --text: #1e1e1e;
    --muted: #666;
    --border: #ccc;
    --input-bg: #fff;
  }*/

    * {
      box-sizing: border-box;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem 3rem;
      box-shadow: var(--card-shadow);
      border: var(--card-border);
      background-image: var(--card-bg);
    }

    .card h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 1rem 1.2rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--input-bg);
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--accent1);
      box-shadow: var(--text-input-shadow);
    }

 
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 8px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--accent1) 50%, transparent 50%);
    border: 1px var(--accent1) solid;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 18px;
    width: 18px;
    background: white;
    border: 2px solid var(--accent1);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--range-input-shadow);
  }

    .range-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .start-btn {
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 14px rgba(108, 99, 255, 0.25);
    }

    .start-btn:hover {
      opacity: 0.95;
    }

    .templates {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .template-btn {
      background: var(--tamplate-btn);
      border: var(--tamplate-btn-border);
      color: var(--text);
      border-radius: 14px;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .template-btn:hover {
      background: var(--tamplate-btn-hover);
      border-color: var(--accent1);
    }

    .template-btn span.time {
      font-size: 0.9rem;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left: Custom Task -->
    <div class="card">
      <h2>📝 Start a Custom Task</h2>
      <form id="custom-form">
        <div class="form-group">
          <label for="title">Task Title</label>
          <input type="text" id="title" required placeholder="e.g., Revise Chemistry Notes" />
        </div>

        <div class="form-group">
          <label for="time">Estimated Time</label>
          <div class="range-label">
            <span>10 min</span>
            <span id="time-display">45 min</span>
            <span>120 min</span>
          </div>
          <input type="range" id="time" min="10" max="120" value="45" />
        </div>

        <div class="form-group">
          <label for="why">Why this task? <small>(optional)</small></label>
          <textarea id="why" rows="3" placeholder="Helps stay focused, it's part of daily goals…"></textarea>
        </div>

        <button type="submit" class="start-btn">✔ Start Task</button>
      </form>
    </div>

    <!-- Right: Predefined Templates -->
    <div class="card">
      <h2>📋 Your Daily Tasks</h2>
      <div class="templates">
        <button class="template-btn" data-title="📘 Solve 2 Math Problems" data-time="30">
          📘 Solve 2 Math Problems <span class="time">30 min</span>
        </button>
        <button class="template-btn" data-title="📗 Revise Biology Diagrams" data-time="25">
          📗 Revise Biology Diagrams <span class="time">25 min</span>
        </button>
        <button class="template-btn" data-title="💻 Work on IronFocus UI" data-time="45">
          💻 Work on IronFocus UI <span class="time">45 min</span>
        </button>
        <button class="template-btn" data-title="📖 Quran Hifz Revision" data-time="35">
          📖 Quran Hifz Revision <span class="time">35 min</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const timeSlider = document.getElementById("time");
    const timeDisplay = document.getElementById("time-display");

    timeSlider.addEventListener("input", () => {
      timeDisplay.textContent = `${timeSlider.value} min`;
      updateSliderBackground();
    });

    document.getElementById("custom-form").addEventListener("submit", e => {
      e.preventDefault();
      const data = {
        title: document.getElementById("title").value.trim(),
        estimatedTime: parseInt(timeSlider.value),
        why: document.getElementById("why").value.trim(),
        startedAt: new Date().toISOString(),
        fromTemplate: false
      };
      console.log("Custom task started:", data);
      alert(`✅ Started custom task: "${data.title}" (${data.estimatedTime} min)`);
    });

    document.querySelectorAll(".template-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const title = btn.dataset.title;
        const time = parseInt(btn.dataset.time);
        const data = {
          title,
          estimatedTime: time,
          why: "",
          startedAt: new Date().toISOString(),
          fromTemplate: true
        };
        console.log("Template task started:", data);
        alert(`🚀 Started: "${title}" (${time} min)`);
      });
    });
updateSliderBackground();
function updateSliderBackground() {
    const value = timeSlider.value;
    const min = timeSlider.min;
    const max = timeSlider.max;
    const percent = ((value - min) / (max - min)) * 100;

    // Color left of thumb, transparent right
    timeSlider.style.background = `linear-gradient(to right, var(--accent1) ${percent}%, transparent ${percent}%)`;
  }
  </script>
</body>
</html>
