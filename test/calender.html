<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-In Calendar</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7fb;
      padding: 40px;
    }

    .calendar-wrapper {
      max-width: 500px;
      margin: auto;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
      font-weight: 600;
      color: #444;
      text-align: center;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .day {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e0e0e0;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .day:hover {
      transform: scale(1.1);
    }

    .dot-red { background-color: #e74c3c; }
    .dot-orange { background-color: #f39c12; }
    .dot-purple { background-color: #9b59b6; }
    .dot-green { background-color: #2ecc71; }
    .dot-gray { background-color: #95a5a6; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">📅 Your Recovery Calendar</h2>
  <div class="calendar-wrapper">
    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <script>
    // Sample checkin data

// Example call:
        const checkins = {
      "2025-06-20": [{ id: "watchP", answer: "Yes" }, { id: "didM", answer: "No" }],
      "2025-06-21": [{ id: "watchP", answer: "Yes" }, { id: "didM", answer: "Yes" }],
      "2025-06-22": [{ id: "watchP", answer: "No" }, { id: "didM", answer: "Yes" }],
      "2025-06-23": [{ id: "watchP", answer: "No" }, { id: "didM", answer: "No" }],
      "2025-06-24": []
    };

    function getDayColor(entryArray) {
      let didM = null;
      let didP = null;

      for (const item of entryArray) {
        if (item.id === "didM") didM = item.answer.toLowerCase();
        if (item.id === "watchP") didP = item.answer.toLowerCase();
      }

      if (didM === "yes" && didP === "yes") return "dot-red";
      if (didM === "yes") return "dot-orange";
      if (didP === "yes") return "dot-purple";
      if (didM === "no" && didP === "no") return "dot-green";
      return "dot-gray";
    }
       function generateCalendar(year, month) {
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = ''; // clear previous

  const startDate = new Date(year, month - 1, 1); // month is 0-based
  const startDay = startDate.getDay();

  const daysInMonth = new Date(year, month, 0).getDate();

  for (let i = 0; i < startDay; i++) {
    const empty = document.createElement('div');
    calendar.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayDiv = document.createElement('div');
    const colorClass = getDayColor(checkins[dateStr] || []);
    dayDiv.className = `day ${colorClass}`;
    dayDiv.textContent = day;
    calendar.appendChild(dayDiv);
  }
  window.debug.getMonthLabel = getMonthLabel;
function getMonthLabel(year, month) {
  const date = new Date(year, month - 1); // month is 0-indexed
  return date.toLocaleString('default', { month: 'long', year: 'numeric' });
}
document.querySelector('.month-label').innerText = getMonthLabel(year, month);
l(`getMonthLabel is ${getMonthLabel(year, month)}`);
}

generateCalendar(2025, 6);



  </script>
</body>
</html>
