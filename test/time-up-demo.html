<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IronFocus - Time Is Up</title>
<style>
  :root {
    --accent1: #6C63FF;
    --accent2: #48C9B0;
    --bg-gradient: linear-gradient(135deg, #f0f4ff, #d6e9fb);
    --text-color: #1e1e2f;
    --button-bg1: #6C63FF;
    --button-bg2: #48C9B0;
    --button-hover1: #5a53d9;
    --button-hover2: #3fa890;
    --finish-bg: #ff6b6b;
    --finish-hover: #e15555;
  }
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0; padding: 0; 
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .time-up-fullscreen {
    background: white;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    padding: 3rem 2rem;
    box-shadow: 0 0 40px rgba(108, 99, 255, 0.25);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    user-select: none;
  }
  header h1 {
    font-size: 3.5rem;
    font-weight: 700;
    margin-bottom: 2rem;
    color: var(--accent1);
    letter-spacing: 0.05em;
  }
  main {
    margin-bottom: 3rem;
  }
  .task-title {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
  }
  .task-title::before {
    content: "📝";
    font-size: 2.2rem;
  }
  .time-spent {
    font-size: 1.6rem;
    color: var(--accent2);
    font-weight: 500;
  }
  .actions {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    border: none;
    padding: 1.1rem 2.5rem;
    border-radius: 14px;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    color: white;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    transition: background-color 0.25s ease;
    min-width: 140px;
  }
  #extend-10 {
    background: var(--button-bg1);
  }
  #extend-10:hover {
    background: var(--button-hover1);
  }
  #extend-20 {
    background: var(--button-bg2);
  }
  #extend-20:hover {
    background: var(--button-hover2);
  }
  #finish-task {
    background: var(--finish-bg);
  }
  #finish-task:hover {
    background: var(--finish-hover);
  }
  footer {
    margin-top: 2rem;
    font-size: 0.9rem;
    color: #555;
  }

  @media (max-width: 480px) {
    .actions {
      flex-direction: column;
      gap: 1rem;
    }
    button {
      min-width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="time-up-fullscreen" role="dialog" aria-labelledby="timeUpTitle">
    <header>
      <h1 id="timeUpTitle">TIME IS UP!</h1>
    </header>
    <main>
      <h2 class="task-title" id="taskTitle">Revise Physics Chapter 4</h2>
      <p class="time-spent" id="timeSpent">⏳ Time Spent: 27:32</p>
      <section class="actions" role="group" aria-label="Time extension and finish actions">
        <button id="extend-10" type="button" aria-label="Extend time by 10 minutes">+10 min</button>
        <button id="extend-20" type="button" aria-label="Extend time by 20 minutes">+20 min</button>
        <button id="finish-task" type="button" aria-label="Finish the current task">Finish Task</button>
      </section>
    </main>
    <footer>
      <small>(Keyboard: Enter = Finish, 1 = +10 min, 2 = +20 min)</small>
    </footer>
  </div>

  <script>
    const extend10Btn = document.getElementById('extend-10');
    const extend20Btn = document.getElementById('extend-20');
    const finishBtn = document.getElementById('finish-task');

    function extendTime(minutes) {
      alert(`⏳ Extended time by ${minutes} minutes!`);
      // Replace alert with your IPC or backend call
    }

    function finishTask() {
      alert("✅ Task finished!");
      // Replace alert with your IPC or backend call
    }

    extend10Btn.addEventListener('click', () => extendTime(10));
    extend20Btn.addEventListener('click', () => extendTime(20));
    finishBtn.addEventListener('click', finishTask);

    // Keyboard shortcuts: Enter = finish, 1 = +10 min, 2 = +20 min
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.isContentEditable) {
        // Don't interfere when typing in buttons/inputs
        return;
      }
      if (e.key === 'Enter') {
        finishTask();
      }
      if (e.key === '1') {
        extendTime(10);
      }
      if (e.key === '2') {
        extendTime(20);
      }
    });
  </script>
</body>
</html>
