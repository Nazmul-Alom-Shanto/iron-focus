<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flame Box</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .flame-box {
      width: 80px;
      height: 80px;
      text-align: center;
      line-height: 80px;
      font-size: 1.8rem;
      color: #ffff;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 80%, #ff9800, #ff5722, #e53935);
      box-shadow:
        0 0 15px 5px rgba(255, 87, 34, 0.8),
        0 0 40px 15px rgba(255, 152, 0, 0.4),
        0 0 60px 30px rgba(255, 87, 34, 0.2);
      animation: flicker 0.25s infinite alternate;
    }

    @keyframes flicker {
      0% {
        transform: scale(1) rotate(-1deg);
        box-shadow:
          0 0 15px 5px rgba(255, 87, 34, 0.9),
          0 0 40px 15px rgba(255, 152, 0, 0.5),
          0 0 60px 30px rgba(255, 87, 34, 0.3);
      }
      100% {
        transform: scale(1.05) rotate(1deg);
        box-shadow:
          0 0 15px 7px rgba(255, 87, 34, 0.7),
          0 0 40px 20px rgba(255, 152, 0, 0.3),
          0 0 60px 35px rgba(255, 87, 34, 0.1);
      }
    }
  </style>
</head>
<body>
  <div class="flame-box">17</div>
</body>
</html>
