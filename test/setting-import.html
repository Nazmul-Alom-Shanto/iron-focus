<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Import/Export</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .settings-section.card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      display: none; /* toggle this with JS */
    }

    .settings-section.card h2 {
      margin-bottom: 1.5rem;
      color: #333;
      font-size: 1.5rem;
      text-align: center;
    }

    .import-log-btn,
    .export-log-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #6C63FF;
      color: white;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .export-log-btn {
      background: #10B981;
    }

    .import-log-btn:hover {
      background: #584be6;
    }

    .export-log-btn:hover {
      background: #0e9e6f;
    }

    .import-log-file {
      display: none;
    }
  </style>
</head>
<body>

  <div class="settings-section card" style="display: block;" id="import-export">
    <h2>Export & Import</h2>
    <p>You can export your task history as a backup or import logs from a previous session.</p>
    <label for="import-log-file" class="import-log-btn">📥 Import JSON</label>
    <input type="file" id="import-log-file" class="import-log-file" accept=".json">
    <input type="button" value="📤 Export Logs" class="export-log-btn">
  </div>

</body>
</html>
