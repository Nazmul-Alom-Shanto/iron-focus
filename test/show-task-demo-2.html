<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IronFocus - Task Mini View</title>
  <style>
    :root {
      --accent1: #6C63FF;
      --accent2: #48C9B0;
      --highlight: #FFB366;
      --text-color: #222222;
      --bg-color: #f5f7ff;
      --border-color: #d3d3f3;
      --progress-border: #00a36c;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 250px;
      height: 133px;
      background: var(--bg-color);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-mini {
      width: 240px;
      height: 125px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(108, 99, 255, 0.15);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .task-mini .title {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent1);
      text-align: center;
    }

    .task-mini .quote {
      font-size: 12px;
      font-style: italic;
      color: var(--highlight);
      text-align: center;
      padding: 0 4px;
      margin: 4px 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-mini .countdown {
      font-size: 20px;
      font-weight: bold;
      background: #ffffff;
      padding: 6px 10px;
      border-radius: 12px;
      border: 2px solid var(--progress-border);
      color: var(--accent2);
      text-align: center;
      font-family: 'Courier New', Courier, monospace;
      box-shadow: inset 0 0 4px rgba(0,128,0,0.2);
    }
  </style>
</head>
<body>
  <div class="task-mini">
    <div class="title">🧪 Chemistry CH-5</div>
    <div class="quote">"Time waits for none — not even your excuses."</div>
    <div class="countdown">02h : 02m : 15s</div>
  </div>
</body>
</html>
